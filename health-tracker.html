async function fsGet(key) {
  try {

      headers: { "Authorization": "Bearer " + token }

async function fsSet(key, data) {
  try {
    const token = await getAuthToken();
    const url = FS_BASE + FS_USER + "-" + key;
    const body = {
      fields: {
        value: {
          stringValue: JSON.stringify(data)
        }
      }
    };
    const res = await fetch(url, {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify(body)
    });
    if (!res.ok) {

// ── WEIGHT PROJECTION MODEL (HT-31) ──────────────────────────────────────────
// Self-correcting weekly milestone model matching the "Weekly Weight
// Milestones" Google Sheet: each week's target is either recalibrated from
// an actual nude-equivalent weigh-in near that week's milestone date, or
// projected forward from the prior week's target using a phase-based weekly
// loss rate. Today's target is then linearly interpolated between the
// current and next weekly milestones. Config lives in Firestore
// (weight-projection-config) so constants can be tuned without a code push.
const SEED_WEIGHT_PROJECTION_CONFIG = {
  startingWeight: 306.2,
  startDate: "2026-07-06", // Week 1 milestone date
  phase1Rate: 0.0052, phase1EndWeek: 26,
  phase2Rate: 0.0034, phase2EndWeek: 78,
  phase3Rate: 0.0013, phase3EndWeek: 156,
  totalWeeks: 156,
  matchWindowDays: 3 // ± days to match an actual weigh-in to a milestone date
};
function weightNudeEquivalent(e) {
  return (e.condition === "clinical" || e.condition === "clothed" || e.condition === "light")
    ? +(e.weight + CLOTHING_OFFSET).toFixed(1)
    : e.weight;
}
function phaseRateForWeek(cfg, weekNum) {
  if (weekNum <= cfg.phase1EndWeek) return cfg.phase1Rate;
  if (weekNum <= cfg.phase2EndWeek) return cfg.phase2Rate;
  return cfg.phase3Rate;
}
// Finds the nude-equivalent weight entry closest to targetDate, within
// ±matchWindowDays. Returns null if none found (e.g. future weeks, or a
// past week with no nearby weigh-in).
function findMilestoneActual(weightEntries, targetDate, windowDays) {
  const targetMs = new Date(targetDate + "T00:00:00").getTime();
  let best = null, bestDiff = Infinity;
  for (const e of weightEntries) {
    if (!e.date) continue;
    const ms = new Date(e.date + "T00:00:00").getTime();
    const diffDays = Math.abs(ms - targetMs) / 86400000;
    if (diffDays <= windowDays && diffDays < bestDiff) {
      bestDiff = diffDays;
      best = e;
    }
  }
  return best ? weightNudeEquivalent(best) : null;
}
// Builds the full weekly milestone table (date + target weight per week),
// recalibrating from actual weigh-ins where available — same behavior as
// the spreadsheet's manual "actual weight" column. Ascending by week.
function buildWeeklyMilestones(cfg, weightEntries) {
  const milestones = [];
  let prevTarget = cfg.startingWeight;
  const startMs = new Date(cfg.startDate + "T00:00:00").getTime();
  for (let week = 1; week <= cfg.totalWeeks; week++) {
    const date = localDateStr(new Date(startMs + (week - 1) * 7 * 86400000));
    const actual = findMilestoneActual(weightEntries, date, cfg.matchWindowDays);
    let target;
    if (actual != null) {
      target = actual;
    } else {
      const rate = phaseRateForWeek(cfg, week);
      const loss = Math.floor(prevTarget * rate * 100) / 100; // ROUNDDOWN, matches sheet
      target = +(prevTarget - loss).toFixed(2);
    }
    milestones.push({ week, date, target });
    prevTarget = target;
  }
  return milestones;
}
// Interpolates today's target weight between the current and next weekly
// milestones, and compares it against today's actual nude-equivalent weight
// (if logged). Returns null if today is before the model's start date.
function interpolatedWeightTarget(cfg, weightEntries) {
  if (!cfg || !cfg.startDate) return null;
  const todayStr = today();
  if (todayStr < cfg.startDate) return null;
  const milestones = buildWeeklyMilestones(cfg, weightEntries || []);
  let idx = -1;
  for (let i = 0; i < milestones.length; i++) {
    if (milestones[i].date <= todayStr) idx = i;
    else break;
  }
  if (idx === -1) return null;
  const current = milestones[idx];
  const next = milestones[idx + 1] || current; // past final week: no further projection
  const daysElapsed = Math.round((new Date(todayStr + "T00:00:00").getTime() - new Date(current.date + "T00:00:00").getTime()) / 86400000);
  const target = +(current.target + (next.target - current.target) * (daysElapsed / 7)).toFixed(2);
  const todaysEntry = (weightEntries || []).find(e => e.date === todayStr);
  const actual = todaysEntry ? weightNudeEquivalent(todaysEntry) : null;
  const diff = actual != null ? +(actual - target).toFixed(2) : null;
  const status = diff == null ? null : diff <= 0 ? "ahead" : "behind";
  return { target, actual, diff, status, currentMilestone: current, nextMilestone: next };
}
// HT-32: generalizes interpolatedWeightTarget to an arbitrary date (not just
// today) — "what weight should I be on date X?" Returns { outOfRange: true,
// ... } if dateStr falls before the model's start or beyond its week-156
// horizon, since a flat extrapolation past that point wouldn't be meaningful.
function weightTargetForDate(cfg, weightEntries, dateStr) {
  if (!cfg || !cfg.startDate || !dateStr) return null;
  const milestones = buildWeeklyMilestones(cfg, weightEntries || []);
  const horizonDate = milestones[milestones.length - 1].date;
  if (dateStr < cfg.startDate) return { outOfRange: true, reason: "before-start", horizonStart: cfg.startDate };
  if (dateStr > horizonDate) return { outOfRange: true, reason: "beyond-horizon", horizonDate, horizonWeight: milestones[milestones.length - 1].target };
  let idx = -1;
  for (let i = 0; i < milestones.length; i++) {
    if (milestones[i].date <= dateStr) idx = i;
    else break;
  }
  const current = milestones[idx];
  const next = milestones[idx + 1] || current;
  const daysElapsed = Math.round((new Date(dateStr + "T00:00:00").getTime() - new Date(current.date + "T00:00:00").getTime()) / 86400000);
  const target = +(current.target + (next.target - current.target) * (daysElapsed / 7)).toFixed(2);
  return { target, currentMilestone: current, nextMilestone: next };
}
// HT-32: "when should I hit weight Y?" — walks the weekly milestone table
// forward from today's bracket, looking for the week-pair where the
// projected trajectory crosses targetWeight, then interpolates a specific
// date within that week. Only past weeks are recalibrated off actual
// weigh-ins, so this is a projection based on current pace, not a
// guarantee. Returns { outOfRange: true, ... } if targetWeight is never
// reached within the model's week-156 horizon.
function dateForWeightTarget(cfg, weightEntries, targetWeight) {
  if (!cfg || !cfg.startDate || targetWeight == null) return null;
  const milestones = buildWeeklyMilestones(cfg, weightEntries || []);
  const todayStr = today();
  let startIdx = 0;
  for (let i = 0; i < milestones.length; i++) {
    if (milestones[i].date <= todayStr) startIdx = i;
    else break;
  }
  for (let i = startIdx; i < milestones.length - 1; i++) {
    const a = milestones[i], b = milestones[i + 1];
    if (a.target === targetWeight) {
      return { date: a.date, currentMilestone: a, nextMilestone: b };
    }
    if (a.target > targetWeight && targetWeight >= b.target) {
      const frac = (a.target - targetWeight) / (a.target - b.target);
      const days = Math.round(frac * 7);
      const date = localDateStr(new Date(new Date(a.date + "T00:00:00").getTime() + days * 86400000));
      return { date, currentMilestone: a, nextMilestone: b };
    }
  }
  const last = milestones[milestones.length - 1];
  if (last.target === targetWeight) return { date: last.date, currentMilestone: last, nextMilestone: last };
  return { outOfRange: true, horizonDate: last.date, horizonWeight: last.target };
}

// ── STORAGE HOOK ──────────────────────────────────────────────────────────────
function usePersistedState(key, seed) {
  const CACHE_KEY = 'ht2026:' + key;

  // Instant render from localStorage cache
  const [data, setData] = useState(() => {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (raw) return JSON.parse(raw);
    } catch {}
    return null;
  });
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    async function load() {
      try {
        const val = await fsGet(key);
        if (val !== null) {
          setData(val);
          try {
            localStorage.setItem(CACHE_KEY, JSON.stringify(val));
          } catch {}
        } else {
          // First run — seed Firestore
          await fsSet(key, seed);
          setData(seed);
          try {
            localStorage.setItem(CACHE_KEY, JSON.stringify(seed));
          } catch {}
        }
      } catch (e) {
        console.error("Firestore load error", key, e);
        // Fall back to cache or seed
        setData(d => d !== null ? d : seed);
      }
      setLoaded(true);
    }
    load();
  }, [key]);
  async function update(d) {
    setData(d);
